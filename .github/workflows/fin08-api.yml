name: FIN-08 Backend Contract and PostgreSQL Integration
on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/fin08-api.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/fin08-api.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fin08
          POSTGRES_PASSWORD: fin08_test_only
          POSTGRES_DB: qatlink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U fin08 -d qatlink_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      FIN08_TEST_DATABASE_URL: postgres://fin08:fin08_test_only@127.0.0.1:5432/qatlink_test
      PGPASSWORD: fin08_test_only
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Apply FIN08 schema to ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U fin08 -d qatlink_test -f sql/001_fin08.sql
      - name: Apply FIN13 additive ledger migration
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U fin08 -d qatlink_test -f sql/002_fin13_unified_ledger.sql
      - name: Apply FIN15 amendment migration
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U fin08 -d qatlink_test -f sql/003_fin15_amendments.sql
      - name: Apply FIN16 credit limit migration
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U fin08 -d qatlink_test -f sql/004_fin16_credit_limits.sql
      - name: Apply FIN17 payment allocation migration
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U fin08 -d qatlink_test -f sql/005_fin17_payment_allocations.sql
      - run: npm test
      - name: Synthetic PostgreSQL backup and restore verification
        run: |
          pg_dump -Fc --no-owner --no-acl -f "$RUNNER_TEMP/qatlink-financial.dump" "$FIN08_TEST_DATABASE_URL"
          createdb -h 127.0.0.1 -U fin08 qatlink_restore_test
          RESTORE_URL=postgres://fin08:fin08_test_only@127.0.0.1:5432/qatlink_restore_test
          pg_restore --exit-on-error --no-owner --no-acl -d "$RESTORE_URL" "$RUNNER_TEMP/qatlink-financial.dump"
          psql "$FIN08_TEST_DATABASE_URL" -Atq -c "SELECT 'movements:'||count(*) FROM financial_movements UNION ALL SELECT 'allocation_entries:'||count(*) FROM financial_payment_allocation_entries UNION ALL SELECT 'allocation_requests:'||count(*) FROM financial_payment_allocation_requests ORDER BY 1" > "$RUNNER_TEMP/source-counts.txt"
          psql "$RESTORE_URL" -Atq -c "SELECT 'movements:'||count(*) FROM financial_movements UNION ALL SELECT 'allocation_entries:'||count(*) FROM financial_payment_allocation_entries UNION ALL SELECT 'allocation_requests:'||count(*) FROM financial_payment_allocation_requests ORDER BY 1" > "$RUNNER_TEMP/restored-counts.txt"
          psql "$FIN08_TEST_DATABASE_URL" -Atq -c "SELECT relationship_id::text||':'||currency||':'||sum(CASE WHEN type='debt' THEN amount ELSE -amount END)::numeric(20,4)::text FROM financial_movements GROUP BY relationship_id,currency ORDER BY 1" > "$RUNNER_TEMP/source-balances.txt"
          psql "$RESTORE_URL" -Atq -c "SELECT relationship_id::text||':'||currency||':'||sum(CASE WHEN type='debt' THEN amount ELSE -amount END)::numeric(20,4)::text FROM financial_movements GROUP BY relationship_id,currency ORDER BY 1" > "$RUNNER_TEMP/restored-balances.txt"
          diff -u "$RUNNER_TEMP/source-counts.txt" "$RUNNER_TEMP/restored-counts.txt"
          diff -u "$RUNNER_TEMP/source-balances.txt" "$RUNNER_TEMP/restored-balances.txt"
