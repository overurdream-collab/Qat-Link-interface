name: FIN-08 Backend Contract and PostgreSQL Integration

on:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/release-readiness/**'
      - '.github/workflows/fin08-api.yml'
  push:
    branches: [main, release/maqwati-green-secure]
    paths:
      - 'server/**'
      - 'scripts/release-readiness/**'
      - '.github/workflows/fin08-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin08-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fin08
          POSTGRES_PASSWORD: fin08_test_only
          POSTGRES_DB: qatlink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U fin08 -d qatlink_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      FIN08_TEST_DATABASE_URL: postgres://fin08:fin08_test_only@127.0.0.1:5432/qatlink_test
      IDENTITY_CI_DATABASE_URL: postgres://fin08:fin08_test_only@127.0.0.1:5432/identity_test
      FIN08_RUNTIME_DATABASE_URL: postgres://maqwati_runtime:runtime_test_only@127.0.0.1:5432/qatlink_test
      FIN08_RESTORE_DATABASE_URL: postgres://fin08:fin08_test_only@127.0.0.1:5432/qatlink_restore
      PGHOST: 127.0.0.1
      PGUSER: fin08
      PGPASSWORD: fin08_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        working-directory: server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate syntax, migrations, full suite and restore
        run: bash scripts/release-readiness/verify-postgres.sh
      - name: Preserve execution evidence including failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin08-postgres-evidence-${{ github.run_id }}
          path: build/release-readiness/
          if-no-files-found: error
          retention-days: 7
