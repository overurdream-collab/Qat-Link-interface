name: Premium Soft UI validation

on:
  push:
    branches:
      - feat/maqwati-premium-soft-ui-20261121
  pull_request:
    branches:
      - feat/maqwati-green-identity-isolated-20261121
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner can execute shell commands
        run: echo 'runner-online' && pwd && uname -a
  flutter-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated UI branch
        uses: actions/checkout@v4
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee premium-pub.log
      - name: Static analysis
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee premium-analyze.log
      - name: Widget and domain regression tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee premium-tests.log
      - name: Build Android debug
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee premium-android.log
      - name: Attach debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maqwati-premium-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload validation logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-validation-logs
          path: premium-*.log
          if-no-files-found: warn
          retention-days: 7
