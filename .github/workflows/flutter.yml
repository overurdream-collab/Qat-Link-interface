name: Flutter UI and financial regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Documentation updated for Flutter changes
        if: github.event_name == 'pull_request'
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_feature_docs.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Generate Android platform for CI build verification
        run: flutter create --platforms=android --project-name qat_link .
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qat-link-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
