name: Check HQ owner brand transfer once
on:
  push:
    branches: [feat/p0-auth-identity-integration-20261118]
    paths: ['.github/workflows/brand-upgrade-once.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-auth-identity-integration-20261118
      - name: Try original-resolution licensed media variants
        env:
          BG_URL: 'https://media.canva.com/v2/image-resize/format:JPG/height:1536/quality:90/uri:ifs%3A%2F%2FM%2F1ceb7e6e-65ac-4bcb-bd2b-cc7d4aea1190/watermark:F/width:864?csig=AAAAAAAAAAAAAAAAAAAAAKQWBmQWFqhSP86PAsqQWBh3dPgLP3s2hK2z2NZ7hs5a&exp=1795057875&osig=AAAAAAAAAAAAAAAAAAAAAIYkd0ADjOLfVpfmq1VmrrdPN0DC81vNoebAeFjDH8F4&signer=media-rpc&token=AAIAAU0AJDFjZWI3ZTZlLTY1YWMtNGJjYi1iZDJiLWNjN2Q0YWVhMTE5MAAAAAABofHJeDgnSnnn-oyYUXwB4hn7oD9xZVak4AtcWnz9e9YExzwjJQ&x-canva-quality=thumbnail'
          LOGO_URL: 'https://media.canva.com/v2/image-resize/format:JPG/height:512/quality:90/uri:ifs%3A%2F%2FM%2F160812a9-6a3d-478d-909c-93b90f931bcd/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAABTzCWIHFPyzWixFIddwZBvrk3njz31sPX-81ZM49E2w&exp=1795057475&osig=AAAAAAAAAAAAAAAAAAAAALARZH_PmZYyPmu4l3C4Yqij2CO4QTCcmA9dT4d5NBxC&signer=media-rpc&token=AAIAAU0AJDE2MDgxMmE5LTZhM2QtNDc4ZC05MDljLTkzYjkwZjkzMWJjZAAAAAABofHDXbio74X0PNWyTLSAESZswyDOWDXN6Qo_giOJiOlvUeiVdg&x-canva-quality=thumbnail'
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --location --max-time 35 "$BG_URL" -o /tmp/brand-bg.jpg; then
            echo "Original media URL is signed for thumbnail size; preserving already imported image."
            exit 0
          fi
          if ! curl --fail --silent --show-error --location --max-time 35 "$LOGO_URL" -o /tmp/brand-logo.jpg; then
            echo "Logo variant unavailable; preserving imported assets."
            exit 0
          fi
          identify -format 'background %wx%h\n' /tmp/brand-bg.jpg
          identify -format 'logo %wx%h\n' /tmp/brand-logo.jpg
          BGDIMS=$(identify -format '%w' /tmp/brand-bg.jpg)
          LOGODIMS=$(identify -format '%w' /tmp/brand-logo.jpg)
          if [ "$BGDIMS" -lt 800 ] || [ "$LOGODIMS" -lt 1000 ]; then
            echo "Result not full resolution; preserving existing assets."
            exit 0
          fi
          cp /tmp/brand-bg.jpg assets/images/maqwati_login_background.jpg
          cp /tmp/brand-logo.jpg assets/images/maqwati_horizontal_logo.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/maqwati_login_background.jpg assets/images/maqwati_horizontal_logo.jpg
          git commit -m "assets(brand): upgrade owner's offline images to original resolution" || exit 0
          git push origin HEAD:feat/p0-auth-identity-integration-20261118
