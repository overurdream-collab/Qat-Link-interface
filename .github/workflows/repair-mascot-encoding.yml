name: One-shot repair of approved mascot asset encoding

on:
  push:
    branches:
      - feat/maqwati-green-identity-isolated-20261121
    paths:
      - .github/workflows/repair-mascot-encoding.yml

permissions:
  contents: write

concurrency:
  group: maqwati-approved-mascot-repair
  cancel-in-progress: false

jobs:
  normalize-asset-files:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install decoder
        run: python3 -m pip install --user 'Pillow>=11,<13'
      - name: Diagnose and normalize image containers without altering character
        run: python3 scripts/repair_original_mascot_encoding.py
      - name: Commit valid image encodings only on original feature branch
        run: |
          git add assets/images/maqwati_approved_mascot.jpeg assets/images/maqwati_feminine_mascot.webp
          if git diff --cached --quiet; then
            echo "Images already have normalized valid encodings"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(assets): normalize approved mascot JPEG and WebP for Flutter decoding"
          git push origin HEAD:feat/maqwati-green-identity-isolated-20261121
