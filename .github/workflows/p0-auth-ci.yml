name: P0 auth integration safety checks

on:
  push:
    branches:
      - feat/p0-auth-identity-integration-20261118
      - integration/fin25-identity-consolidation-20261121
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Full Flutter unit and widget suite
        run: flutter test
      - name: Auth flow and FIN25 client targeted checks
        run: flutter test test/screens/auth_screens_widget_test.dart test/screens/fin25_pilot_test.dart test/services/fin25_otp_client_test.dart
      - name: Verify one configured production origin for login and registration
        run: flutter test test/screens/unified_auth_configured_widget_test.dart --dart-define=MAQWATI_API_BASE_URL=https://api.example.test

  identity-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check identity service syntax
        run: node --check scripts/fin25_identity_live_pilot.mjs && node --check server/src/fin25_otp_transport.mjs && node --check server/src/identity_logic.mjs && node --check server/src/identity_session_limiter.mjs && node --check server/src/identity_finance_provisioner.mjs && node --check server/src/identity_server.mjs && node --check scripts/check_identity_runtime_trust.mjs
      - name: Verify trust preflight fails safely without local credentials
        run: |
          if node scripts/check_identity_runtime_trust.mjs > preflight.log 2>&1; then
            echo "Preflight must fail closed without local secrets"; exit 1
          fi
          if ! grep -q 'BLOCKED\|identity.runtime.env missing' preflight.log; then
            cat preflight.log; exit 1
          fi
          echo "Read-only preflight correctly blocks unconfigured deployment"
      - name: Install Node identity test dependencies
        working-directory: server
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run identity security unit tests
        working-directory: server
        run: node --test test/p0_identity_*.test.mjs

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Generate Android project for isolated CI compile
        run: flutter create --platforms=android --project-name qat_link --org com.maqwati .
      - name: Verify offline Maqwati preview assets (release requires originals)
        run: python3 scripts/check_maqwati_brand_assets.py --mode preview
      - name: Compile main Flutter app as debug APK (not a release)
        run: flutter build apk --debug --target lib/main.dart
      - name: Verify build artifact and debug signature
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
          echo "Build verified. Identity endpoint not supplied: this is NOT a functional login release."
      # One supported application binary. A functional APK can only be built
      # when the operator sets the SAME persistent HTTPS origin for FIN25/Identity.
      - name: Validate configured public HTTPS origin
        if: ${{ vars.MAQWATI_API_BASE_URL != '' }}
        env:
          API_ORIGIN: ${{ vars.MAQWATI_API_BASE_URL }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          value=os.environ['API_ORIGIN']
          parsed=urllib.parse.urlsplit(value)
          assert parsed.scheme == 'https' and parsed.hostname, 'HTTPS origin required'
          assert not parsed.username and not parsed.password and not parsed.query and not parsed.fragment
          assert parsed.path in ('','/'), 'Origin cannot contain a path'
          assert not parsed.hostname.endswith('.trycloudflare.com'), 'Temporary tunnel is not a stable origin'
          print('Single HTTPS origin validated')
          PY
      - name: Build the only connected login APK
        if: ${{ vars.MAQWATI_API_BASE_URL != '' }}
        env:
          API_ORIGIN: ${{ vars.MAQWATI_API_BASE_URL }}
        run: flutter build apk --debug --target lib/main.dart --dart-define=MAQWATI_API_BASE_URL="$API_ORIGIN"
      - name: Verify single-origin connected APK signature
        if: ${{ vars.MAQWATI_API_BASE_URL != '' }}
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish one unified Maqwati login APK
        if: ${{ vars.MAQWATI_API_BASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: maqwati-unified-login-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  brand-release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify asset gate logic is executable
        run: |
          python3 scripts/check_maqwati_brand_assets.py --mode preview
          python3 -m py_compile scripts/check_maqwati_brand_assets.py
          echo "Full-size release assets must be checked with --mode release BEFORE any distribution."
      - name: Parse Windows PowerShell brand installer
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          foreach ($script in @('scripts/install_maqwati_brand_assets.ps1','scripts/build_maqwati_branded_preview.ps1','scripts/fin25_identity_readonly_preflight.ps1','scripts/check_unified_auth_live.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
          }

  identity-postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_identity
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: identity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_identity -d identity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: test_identity
      PGPASSWORD: local_ci_only
      PGDATABASE: identity_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply identity schema to isolated disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f server/sql/008_p0_identity_accounts.sql
      - name: Test phone constraint, duplicate protection, transaction rollback
        run: psql -X -v ON_ERROR_STOP=1 -f server/test/p0_identity_schema_checks.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Node identity test dependencies
        working-directory: server
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run synthetic HTTP identity login using real PostgreSQL (never sends SMS)
        working-directory: server
        env:
          IDENTITY_CI_DATABASE_URL: postgresql://test_identity:local_ci_only@127.0.0.1:5432/identity_ci
        run: node --test test/p0_identity_http_postgres.test.mjs
      - name: Apply isolated FIN25 gateway and OTP schemas to CI-only PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 -f server/sql/009_fin25_gateway_isolated.sql
          psql -X -v ON_ERROR_STOP=1 -f server/sql/010_fin25_otp_isolated.sql
      - name: Test public OTP fail-closed budget with real isolated PostgreSQL
        working-directory: server
        env:
          IDENTITY_CI_DATABASE_URL: postgresql://test_identity:local_ci_only@127.0.0.1:5432/identity_ci
        run: node --test test/fin25_public_otp_http_postgres.test.mjs

  identity-image-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse isolated identity Compose without changing running services
        run: |
          cp deploy/p0-identity/identity.runtime.env.example deploy/p0-identity/identity.runtime.env
          cp deploy/p0-identity/identity.db.env.example deploy/p0-identity/identity.db.env
          docker compose -f deploy/p0-identity/compose.yml --env-file deploy/p0-identity/identity.runtime.env config --quiet
          rm deploy/p0-identity/identity.runtime.env deploy/p0-identity/identity.db.env
      - name: Parse the EXISTING unified FIN25 Caddy ingress (no deployment)
        run: |
          docker run --rm \
            -v "$PWD/deploy/fin25/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile > /dev/null
      - name: Build standalone identity Node image in isolated CI
        run: docker build -f server/Dockerfile.identity -t maqwati-identity-ci:check ./server
