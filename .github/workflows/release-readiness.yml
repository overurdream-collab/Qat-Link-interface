name: Maqwati release candidate verification

on:
  push:
    branches: [release/maqwati-green-secure]
  pull_request:
    branches: [feat/maqwati-green-identity-isolated-20261121, release/maqwati-green-secure]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install pinned Actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate changed release workflows and shell syntax
        run: |
          actionlint -color .github/workflows/fin08-api.yml .github/workflows/release-readiness.yml
          bash -n scripts/release-readiness/verify-postgres.sh

  node-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Locked install, syntax, privacy regression and all dependency audit
        working-directory: server
        run: |
          set -euo pipefail
          mkdir -p ../build/release-readiness
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee ../build/release-readiness/npm-ci.log
          npm run check 2>&1 | tee ../build/release-readiness/node-check.log
          node --test --test-reporter=tap test/security_hardening.test.mjs test/validation.test.mjs 2>&1 | tee ../build/release-readiness/security.tap
          npm audit --audit-level=high --json > ../build/release-readiness/npm-audit.json
      - name: Upload audit and privacy execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-node-security-${{ github.run_id }}
          path: build/release-readiness/
          if-no-files-found: error
          retention-days: 7

  codeql-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Entitlement/upload failures remain visible failures; no best-effort success.
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: build/release-readiness/codeql
      - name: Preserve SARIF execution output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-codeql-${{ github.run_id }}
          path: build/release-readiness/codeql/
          if-no-files-found: warn
          retention-days: 7

  flutter-and-offline-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Analyze and full Flutter regression without updating goldens
        run: |
          set -euo pipefail
          mkdir -p build/release-readiness
          flutter --version 2>&1 | tee build/release-readiness/flutter-version.log
          flutter pub get 2>&1 | tee build/release-readiness/flutter-pub-get.log
          flutter analyze --no-fatal-infos 2>&1 | tee build/release-readiness/flutter-analyze.log
          flutter test 2>&1 | tee build/release-readiness/flutter-test.log
      - name: Generate isolated Android offline preview wrapper
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.maqwatilink --project-name qat_link .
          python3 scripts/release-readiness/prepare-offline-preview.py
      - name: Build offline preview only
        run: |
          set -euo pipefail
          flutter build apk --release -t lib/main_green_preview.dart 2>&1 | tee build/release-readiness/flutter-build.log
          python3 scripts/release-readiness/verify-offline-apk.py
      - name: Preserve Flutter evidence and installable OFFLINE preview APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maqwati-OFFLINE-preview-and-evidence-${{ github.run_id }}
          path: |
            build/release-readiness/
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
