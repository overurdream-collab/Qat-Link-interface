name: Safe bug report / بلاغ خطأ آمن
description: Report an application bug without private user information
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        الرجاء استخدام بيانات اختبار اصطناعية فقط. لا تُرفق أرقام هواتف العملاء أو رموز OTP/JWT أو الصور الخاصة أو تفاصيل المبالغ أو سجلات الخادم الخام.
        For security vulnerabilities, use the private Security Advisory workflow, not this template.
  - type: input
    id: build
    attributes:
      label: Build / Commit
      description: App version or Git commit SHA
      placeholder: 7b9ea986f518
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Component / القسم
      options:
        - Client / العميل
        - Merchant / التاجر
        - Accounting / المحاسبة
        - Identity / المصادقة
        - Networking / الشبكات
        - UI / الواجهات
        - Other / أخرى
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce using synthetic data
      description: Describe steps without real personal or financial data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: safe-incident
    attributes:
      label: Safe incident category and UTC time (optional)
      description: Copy only the sanitized category and UTC timestamp
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal information, raw error payloads and secrets
          required: true
