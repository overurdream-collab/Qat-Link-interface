services:
  enrollment:
    build:
      context: ../../server
      dockerfile: Dockerfile.fin25
    command: node src/fin25_gateway_enrollment.mjs
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      FIN25_ADMIN_KEY: ${FIN25_ADMIN_KEY:?FIN25_ADMIN_KEY required}
      FIN25_PORT: "8082"
      FIN25_BIND_HOST: "0.0.0.0"
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  otp:
    build:
      context: ../../server
      dockerfile: Dockerfile.fin25
    command: node src/fin25_otp_transport.mjs
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET required}
      OTP_ENCRYPTION_KEY_HEX: ${OTP_ENCRYPTION_KEY_HEX:?OTP_ENCRYPTION_KEY_HEX required}
      OTP_INTERNAL_API_KEY: ${OTP_INTERNAL_API_KEY:?OTP_INTERNAL_API_KEY required}
      OTP_ENABLED: ${OTP_ENABLED:-false}
      OTP_PUBLIC_REQUEST_ENABLED: ${OTP_PUBLIC_REQUEST_ENABLED:-false}
      OTP_PUBLIC_MAX_PER_HOUR: ${OTP_PUBLIC_MAX_PER_HOUR:-12}
      FIN25_SMS_DISPATCH_ENABLED: ${FIN25_SMS_DISPATCH_ENABLED:-false}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:?JWT_PUBLIC_KEY_PEM required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE required}
      FIN25_OTP_PORT: "8083"
      FIN25_BIND_HOST: "0.0.0.0"
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  https:
    image: caddy:2-alpine
    ports: ["8443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
    networks:
      - default
      - fin25-existing
    depends_on: [enrollment,otp]
    restart: unless-stopped

networks:
  fin25-existing:
    external: true
    name: ${FIN25_DOCKER_NETWORK:?FIN25_DOCKER_NETWORK required}
